name: Validate loading-profile update responses
on:
  push:
    branches: ['validation/loading-update-response-20260926']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.11', '3.12']
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      MPLBACKEND: Agg
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - name: Check out validation scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Check out exact submitted source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: sylvesterkaczmarek/prog_server
          ref: 40d5491866b4ef9db6d921c4fc792cb839da52ee
          path: source
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python }}
      - name: Install test dependencies
        run: python -m pip install -e ./source pytest coverage build flake8 
      - name: Validate fixed and original code
        run: python validation/verify.py source
      - name: Save evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: validation-${{ matrix.python }}
          path: evidence/
